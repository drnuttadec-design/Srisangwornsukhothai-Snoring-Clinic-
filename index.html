<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Test - คลินิกนอนกรน รพ.ศรีสังวรสุโขทัย (Premium Edition)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase v11 Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    
    window.FirebaseHelpers = {
      initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
      getFirestore, collection, addDoc, onSnapshot, query
    };
  </script>

  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    /* Premium Input Styling */
    .premium-input {
      width: 100%; border: 1px solid #e2e8f0; background-color: #f8fafc; border-radius: 0.75rem; 
      padding: 0.75rem 1rem; color: #0f172a; transition: all 0.3s ease; outline: none;
    }
    .premium-input:focus {
      background-color: #ffffff; border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
    }
    /* Custom Scrollbar for Chat */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-amber-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 0. Icon Components
    // ==========================================
    const Icon = ({ name, size = 24, className = "" }) => {
      const icons = {
        Activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        FileText: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
        User: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        LogIn: '<path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
        LogOut: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
        MessageCircle: '<path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>',
        X: '<path d="M18 6L6 18M6 6l12 12"/>',
        Send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
        Download: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
        BarChart2: '<path d="M18 20V10M12 20V4M6 20v-6"/>',
        Printer: '<path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/>',
        ChevronRight: '<path d="M9 18l6-6-6-6"/>',
        CheckCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
      };
      return (
        <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" dangerouslySetInnerHTML={{ __html: icons[name] }} />
      );
    };

    // ==========================================
    // 1. Setup Data
    // ==========================================
    let db = null, auth = null, appId = 'sleep-test-app';
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmbD85hEUGx-uoCJHukG6bhurqea6vlTOYjZk379aiscadAjGVbtRzNy3GBwXLWNtS/exec"; 
    
    const initFirebase = () => {
      if (!window.FirebaseHelpers) {
        setTimeout(initFirebase, 100);
        return;
      }
      try {
        const { initializeApp, getAuth, getFirestore } = window.FirebaseHelpers;
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);
          if (typeof __app_id !== 'undefined') appId = __app_id;
        }
      } catch (e) {
        console.log("Firebase not initialized. App will use Google Sheets only.");
      }
    };
    initFirebase();

    // ==========================================
    // Helper: Gemini API & Form Generater
    // ==========================================
    const fetchGeminiWithBackoff = async (payload, apiKey) => {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      const options = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) };
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i <= 5; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) throw new Error(`API Error ${response.status}`);
          return await response.json();
        } catch (error) {
          if (i === 5) throw error; 
          await new Promise(res => setTimeout(res, delays[i])); 
        }
      }
    };

    const calculateScore = (arr) => arr.reduce((sum, val) => sum + (Number(val) || 0), 0);

    const generateFormHTML = (data) => {
      const d = data || {};
      const sym = d.symptoms || [];
      const sb = d.stopBang || Array(8).fill(null);
      const ep = d.epworth || Array(8).fill(null);
      
      const cb = (cond) => cond ? '&#9745;' : '&#9744;';
      const line = (val, length = 20) => val ? `<u>&nbsp;${val}&nbsp;</u>` : '.'.repeat(length);

      return `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset="utf-8">
          <title>ใบส่งตรวจการนอนหลับ - ${d.patientName || 'ไม่ระบุ'}</title>
          <style>
            @page { size: A4; margin: 10mm; }
            body { font-family: 'Sarabun', 'TH Sarabun New', Tahoma, sans-serif; font-size: 12pt; line-height: 1.2; color: #000; padding: 0; margin: 0; }
            .title { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 10px; }
            .box { font-size: 14pt; font-family: 'Segoe UI Symbol', sans-serif; vertical-align: middle; }
            table { width: 100%; border-collapse: collapse; margin-top: 5px; margin-bottom: 10px; font-size: 11pt; }
            table, th, td { border: 1px solid black; }
            th, td { padding: 2px 4px; text-align: left; vertical-align: middle; }
            .text-center { text-align: center; }
            .mb { margin-bottom: 8px; }
            .row { display: block; margin-bottom: 3px; }
          </style>
        </head>
        <body>
          <div class="title">ใบส่งตรวจการนอนหลับ(Sleep test) คลินิกนอนกรนโรงพยาบาลศรีสังวรสุโขทัย</div>
          <div class="mb">
            ชื่อ-นามสกุล ${line(d.patientName, 40)} เบอร์โทร ${line(d.phone, 20)} HN ${line(d.hn, 20)}<br>
            สิทธิการรักษา &nbsp; 
            <span class="box">${cb(d.rights === 'ข้าราชการเบิกจ่ายตรง')}</span> ข้าราชการเบิกจ่ายตรง &nbsp; 
            <span class="box">${cb(d.rights === 'ประกันสังคม')}</span> ประกันสังคม &nbsp; 
            <span class="box">${cb(d.rights === 'สิทธิ30บาท สปสช' || d.rights === 'สิทธิ30 บาท สปสช')}</span> สิทธิ30 บาท สปสช<br>
            เป็นการส่งตรวจการนอนหลับ &nbsp;
            <span class="box">${cb(d.visitType === 'ครั้งแรก')}</span> ครั้งแรก &nbsp;
            <span class="box">${cb(d.visitType === 'ครั้งที่...')}</span> ครั้งที่.................... &nbsp;&nbsp;&nbsp;
            วันที่นัดตรวจ ${line(d.appointmentDate, 20)}
          </div>
          <div class="mb">
            <b>History & Physical Exam.</b> (BMI= ${line(d.bmi, 15)} kg/m²)<br>
            <div class="row">
              <span class="box">${cb(sym.includes('กรน'))}</span> กรน &nbsp;&nbsp; 
              <span class="box">${cb(sym.includes('ง่วงระหว่างวัน'))}</span> ง่วงระหว่างวัน &nbsp;&nbsp; 
              <span class="box">${cb(sym.includes('ปวดศีรษะในตอนเช้า'))}</span> ปวดศีรษะในตอนเช้า
            </div>
            <div class="row">
              <span class="box">${cb(sym.includes('หลับไม่สนิทในระหว่างคืน'))}</span> หลับไม่สนิทในระหว่างคืน &nbsp;&nbsp; 
              <span class="box">${cb(sym.includes('ขากระตุก/ตะคริวระหว่างคืน'))}</span> ขากระตุก/ตะคริวระหว่างคืน
            </div>
            <div class="row">
              <span class="box">${cb(sym.includes('นอนไม่หลับ'))}</span> นอนไม่หลับ &nbsp;&nbsp; 
              <span class="box">${cb(sym.includes('ละเมอ'))}</span> ละเมอ &nbsp;&nbsp; 
              <span class="box">${cb(sym.includes('นอนกัดฟัน'))}</span> นอนกัดฟัน
            </div>
            <div class="row">
              <span class="box">&#9744;</span> อื่นๆ........................................................................................................................
            </div>
          </div>
          <div class="mb">
            Nasal cavity...............................................................................................................................................................<br>
            U/D or allergy Hx or previous medication ${line(d.medicalHistory, 80)}<br>
            ยากลุ่มจิตเวช หรือยานอนหลับ &nbsp; <span class="box">&#9744;</span> ไม่มี &nbsp; <span class="box">&#9744;</span> มีระบุ................................................................................................<br>
            เวลาเข้านอน-ตื่นนอน ${line(d.sleepTime, 50)} &nbsp;&nbsp; เครื่องดื่ม ชา/กาแฟ/แอลกอฮอล์ ${line(d.beverages, 50)}<br>
            FTP I/IIa/IIb/III/IV, Tonsil 1/2/3+, <span class="box">&#9744;</span> Elongation Uvula, <span class="box">&#9744;</span> scalloping tongue
          </div>

          <b>แบบสอบถาม STOP-BANG (รวมคะแนน ${line(d.stopBangScore, 10)})</b>
          <table>
            <tr><th>แบบสอบถาม</th><th class="text-center" width="60">ใช่</th><th class="text-center" width="60">ไม่ใช่</th></tr>
            <tr><td>1. คุณนอนกรนดังใช่หรือไม่(ดังกว่าเสียงพูด หรือ ดังพอที่จะได้ยินออกไปนอกห้อง)</td><td class="text-center"><span class="box">${cb(sb[0] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[0] == 0 && sb[0] !== null)}</span></td></tr>
            <tr><td>2. คุณมักจะรู้สึกอ่อนเพลีย ล้า หรือ ง่วงนอนในระหว่างกลางวันบ่อย ๆ หรือไม่?</td><td class="text-center"><span class="box">${cb(sb[1] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[1] == 0 && sb[1] !== null)}</span></td></tr>
            <tr><td>3. มีคนเคยสังเกตเห็นว่าคุณหยุดหายใจขณะที่คุณหลับอยู่หรือไม่ ?</td><td class="text-center"><span class="box">${cb(sb[2] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[2] == 0 && sb[2] !== null)}</span></td></tr>
            <tr><td>4. คุณมีความดันโลหิตสูง หรือกำลังรักษาโรคความดันโลหิตสูงอยู่หรือไม่?</td><td class="text-center"><span class="box">${cb(sb[3] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[3] == 0 && sb[3] !== null)}</span></td></tr>
            <tr><td>5. ดัชนีมวลกายมากกว่า 35 หรือไม่?</td><td class="text-center"><span class="box">${cb(sb[4] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[4] == 0 && sb[4] !== null)}</span></td></tr>
            <tr><td>6. อายุมากกว่า 50 ปี หรือไม่?</td><td class="text-center"><span class="box">${cb(sb[5] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[5] == 0 && sb[5] !== null)}</span></td></tr>
            <tr><td>7. เส้นรอบวงคอมากกว่า 40 ซม. หรือไม่?</td><td class="text-center"><span class="box">${cb(sb[6] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[6] == 0 && sb[6] !== null)}</span></td></tr>
            <tr><td>8. เป็นเพศชายหรือไม่ ?</td><td class="text-center"><span class="box">${cb(sb[7] == 1)}</span></td><td class="text-center"><span class="box">${cb(sb[7] == 0 && sb[7] !== null)}</span></td></tr>
          </table>
          
          <b>แบบสอบถามความง่วง Epworth sleepiness scale</b> (รวมคะแนน ${line(d.epworthScore, 10)})<br>
          ความเป็นไปได้ที่จะง่วงหรือเผลอหลับขณะทำกิจกรรมดังต่อไปนี้ โดยลงเป็นคะแนนดังนี้ 0= ไม่มีเลย 1= น้อย 2= ปานกลาง 3= สูง
          <table>
            <tr><th>กิจกรรม</th><th class="text-center" width="40">0</th><th class="text-center" width="40">1</th><th class="text-center" width="40">2</th><th class="text-center" width="40">3</th></tr>
            <tr><td>1. นั่งและอ่านหนังสือ</td><td class="text-center"><span class="box">${cb(ep[0] == 0 && ep[0] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[0] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[0] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[0] == 3)}</span></td></tr>
            <tr><td>2. ดูโทรทัศน์/ซีรีย์</td><td class="text-center"><span class="box">${cb(ep[1] == 0 && ep[1] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[1] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[1] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[1] == 3)}</span></td></tr>
            <tr><td>3. นั่งเฉยๆ ในที่สาธารณะ เช่น ที่ประชุมสัมมนา หรือ โรงภาพยนตร์</td><td class="text-center"><span class="box">${cb(ep[2] == 0 && ep[2] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[2] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[2] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[2] == 3)}</span></td></tr>
            <tr><td>4. นั่งเป็นผู้โดยสารในรถนานกว่า 1 ชั่วโมงอย่างต่อเนื่อง</td><td class="text-center"><span class="box">${cb(ep[3] == 0 && ep[3] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[3] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[3] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[3] == 3)}</span></td></tr>
            <tr><td>5. นอนเอนหลังเพื่อพักผ่อนในตอนบ่ายถ้ามีโอกาส</td><td class="text-center"><span class="box">${cb(ep[4] == 0 && ep[4] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[4] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[4] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[4] == 3)}</span></td></tr>
            <tr><td>6. นั่งและพูดคุยกับผู้อื่น</td><td class="text-center"><span class="box">${cb(ep[5] == 0 && ep[5] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[5] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[5] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[5] == 3)}</span></td></tr>
            <tr><td>7. นั่งเงียบๆ หลังอาหารกลางวันโดยที่ไม่ได้ดื่มแอลกอฮอล์</td><td class="text-center"><span class="box">${cb(ep[6] == 0 && ep[6] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[6] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[6] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[6] == 3)}</span></td></tr>
            <tr><td>8. ขับรถแต่หยุดรถเพื่อรอสัญญาณจราจรนาน 2-3 นาที</td><td class="text-center"><span class="box">${cb(ep[7] == 0 && ep[7] !== null)}</span></td><td class="text-center"><span class="box">${cb(ep[7] == 1)}</span></td><td class="text-center"><span class="box">${cb(ep[7] == 2)}</span></td><td class="text-center"><span class="box">${cb(ep[7] == 3)}</span></td></tr>
          </table>

          <div style="margin-top: 15px;">
            ข้าพเจ้าได้รับทราบค่าใช้จ่ายเพิ่มเติมที่ต้องชำระเพิ่มและยินดีชำระตามที่ได้ชี้แจงเพื่อตรวจการนอนหลับ รวมค่าใช้จ่าย (ส่วนเกิน)....................................บาท<br><br>
            <table style="border: none; width: 100%; margin-bottom: 0;">
              <tr style="border: none;">
                <td style="border: none; text-align: right; padding-right: 50px;">ลงชื่อ................................................................(ผู้เข้ารับการตรวจ)</td>
              </tr>
              <tr style="border: none;">
                <td style="border: none; text-align: right; padding-right: 50px; padding-top: 10px;">แพทย์ผู้ส่งตรวจ................................................................</td>
              </tr>
            </table>
          </div>
        </body>
        </html>
      `;
    };

    // ==========================================
    // Main App Component
    // ==========================================
    function App() {
      const [currentView, setCurrentView] = useState('form'); 
      const [user, setUser] = useState(null);
      const [formData, setFormData] = useState({
        patientName: '', phone: '', rights: '', hn: '', visitType: '', appointmentDate: '', weight: '', height: '', bmi: '',
        symptoms: [], medicalHistory: '', sleepTime: '', beverages: '',
        stopBang: Array(8).fill(null), epworth: Array(8).fill(null), contactRequested: ''
      });

      useEffect(() => {
        const checkAuth = setInterval(() => {
          if (window.FirebaseHelpers && window.FirebaseHelpers.getAuth && auth) {
            clearInterval(checkAuth);
            const { signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseHelpers;
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) { console.error("Auth Error", error); }
            };
            initAuth();
            onAuthStateChanged(auth, setUser);
          }
        }, 500);
        return () => clearInterval(checkAuth);
      }, []);

      return (
        <div className="min-h-screen font-sans text-slate-800 selection:bg-amber-500 selection:text-white">
          {/* Sleek Deep Navy Navigation Bar */}
          <nav className="bg-[#0f172a] text-white shadow-[0_4px_20px_rgba(0,0,0,0.08)] border-b border-amber-500/20 px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-40 backdrop-blur-md bg-[#0f172a]/95">
            <div className="flex items-center gap-3">
              <div className="relative">
                <div className="absolute inset-0 bg-amber-400 blur-[10px] opacity-20 rounded-full"></div>
                <img src="1586939599751.jpg" alt="โลโก้ รพ.ศรีสังวรสุโขทัย" className="relative h-11 w-11 bg-white rounded-full object-contain p-0.5 border-2 border-amber-500/50" onError={(e) => { e.target.onerror = null; e.target.src = "https://via.placeholder.com/50/ffffff/000000?text=Logo"; }} />
              </div>
              <div>
                <h1 className="text-xl font-bold hidden sm:block tracking-tight text-white">ห้องตรวจหูคอจมูก <span className="text-amber-400 font-normal">รพ.ศรีสังวรสุโขทัย</span></h1>
                <h1 className="text-lg font-bold sm:hidden tracking-tight text-white">ENT Clinic <span className="text-amber-400">SSW</span></h1>
              </div>
            </div>
            <div className="flex gap-4 md:gap-6 text-sm font-medium">
              <button onClick={() => setCurrentView('form')} className={`flex items-center gap-2 hover:text-amber-400 transition-colors ${currentView === 'form' ? 'text-amber-400' : 'text-slate-300'}`}>
                <Icon name="FileText" size={18} /> <span className="hidden md:inline">ส่งตรวจการนอนหลับ</span>
              </button>
              {currentView === 'dashboard' ? (
                 <button onClick={() => setCurrentView('form')} className="flex items-center gap-1 text-slate-300 hover:text-red-400 transition-colors">
                   <Icon name="LogOut" size={18} /> <span className="hidden md:inline">ออกจากระบบ</span>
                 </button>
              ) : (
                <button onClick={() => setCurrentView('login')} className={`flex items-center gap-1 hover:text-amber-400 transition-colors ${currentView === 'login' ? 'text-amber-400' : 'text-slate-300'}`}>
                  <Icon name="LogIn" size={18} /> <span className="hidden md:inline">สำหรับเจ้าหน้าที่</span>
                </button>
              )}
            </div>
          </nav>

          <main className="container mx-auto p-4 md:p-8 pb-24 max-w-5xl">
            {currentView === 'form' && <PatientForm user={user} formData={formData} setFormData={setFormData} />}
            {currentView === 'login' && <AdminLogin onLogin={() => setCurrentView('dashboard')} />}
            {currentView === 'dashboard' && <AdminDashboard user={user} />}
          </main>

          <Chatbot formData={formData} />
        </div>
      );
    }

    // ==========================================
    // Patient Form Component (Premium Layout)
    // ==========================================
    function PatientForm({ user, formData, setFormData }) {
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitSuccess, setSubmitSuccess] = useState(false);

      const stopBangQuestions = [
        "คุณนอนกรนดังใช่หรือไม่", "คุณมักจะรู้สึกอ่อนเพลีย ล้า หรือ ง่วงนอนในระหว่างกลางวันบ่อยๆ หรือไม่?",
        "มีคนเคยสังเกตเห็นว่าคุณหยุดหายใจขณะที่คุณหลับอยู่หรือไม่?", "คุณมีความดันโลหิตสูง หรือกำลังรักษาโรคความดันโลหิตสูงอยู่หรือไม่?",
        "ดัชนีมวลกาย (BMI) มากกว่า 35 หรือไม่?", "อายุมากกว่า 50 ปี หรือไม่?", "เส้นรอบวงคอมากกว่า 40 ซม. หรือไม่?", "เป็นเพศชายหรือไม่ ?"
      ];
      const epworthQuestions = [
        "นั่งและอ่านหนังสือ", "ดูโทรทัศน์/ซีรีย์", "นั่งเฉยๆ ในที่สาธารณะ", "นั่งเป็นผู้โดยสารในรถนานกว่า 1 ชั่วโมง",
        "นอนเอนหลังพักผ่อนในตอนบ่าย", "นั่งและพูดคุยกับผู้อื่น", "นั่งเงียบๆ หลังอาหารกลางวัน", "ขับรถแต่หยุดรถเพื่อรอสัญญาณจราจร"
      ];

      const handleCheckboxChange = (e, arrayName) => {
        const { value, checked } = e.target;
        if (checked) setFormData(prev => ({ ...prev, [arrayName]: [...prev[arrayName], value] }));
        else setFormData(prev => ({ ...prev, [arrayName]: prev[arrayName].filter(item => item !== value) }));
      };

      const stopBangTotal = calculateScore(formData.stopBang);
      const epworthTotal = calculateScore(formData.epworth);

      useEffect(() => {
        if (formData.weight && formData.height) {
          const weight = parseFloat(formData.weight);
          const heightInMeters = parseFloat(formData.height) / 100;
          if (heightInMeters > 0) setFormData(prev => ({ ...prev, bmi: (weight / (heightInMeters * heightInMeters)).toFixed(2) }));
        } else {
          setFormData(prev => ({ ...prev, bmi: '' }));
        }
      }, [formData.weight, formData.height]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        const finalData = { ...formData, stopBangScore: stopBangTotal, epworthScore: epworthTotal, createdAt: new Date().toISOString() };

        try {
          if (user && db && window.FirebaseHelpers) {
            const { collection, addDoc } = window.FirebaseHelpers;
            const dataRef = collection(db, 'artifacts', appId, 'public', 'data', 'sleep_tests');
            await addDoc(dataRef, finalData);
          }
          if (GOOGLE_SCRIPT_URL) {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(finalData) });
          }
          setSubmitSuccess(true);
          window.scrollTo(0, 0);
        } catch (error) {
          console.error("Error submitting:", error);
          alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
        } finally {
          setIsSubmitting(false);
        }
      };

      const exportSummaryToPDF = () => {
        const dataForPrint = { ...formData, stopBangScore: stopBangTotal, epworthScore: epworthTotal };
        let htmlContent = generateFormHTML(dataForPrint);
        htmlContent = htmlContent.replace('</body>', '<script>window.onload = function() { setTimeout(function(){ window.print(); window.close(); }, 500); }<\/script></body>');
        const printWindow = window.open('', '_blank');
        printWindow.document.write(htmlContent);
        printWindow.document.close();
      };

      if (submitSuccess) {
        const isHighRiskSB = stopBangTotal >= 3;
        const isHighRiskEp = epworthTotal > 10;
        return (
          <div className="max-w-5xl mx-auto space-y-8 animate-in fade-in duration-500">
            {/* Success Hero Card */}
            <div className="bg-white p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-400 to-emerald-600"></div>
              <div className="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border border-emerald-100"><Icon name="CheckCircle" size={40} /></div>
              <h2 className="text-3xl font-bold text-slate-900 mb-3 tracking-tight">ส่งข้อมูลสำเร็จเรียบร้อย</h2>
              <p className="text-slate-500 max-w-lg mx-auto text-lg">ข้อมูลสุขภาพของคุณถูกบันทึกเข้าระบบของคลินิกแล้ว ด้านล่างนี้คือผลการประเมินเบื้องต้นของคุณ</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              {/* Summary Panel */}
              <div className="bg-white p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 flex flex-col relative overflow-hidden">
                <div className="absolute top-0 right-0 w-32 h-32 bg-amber-50 rounded-bl-full -z-10 opacity-50"></div>
                
                <h3 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-3">
                  <div className="w-1.5 h-6 bg-amber-500 rounded-full"></div> 
                  สรุปผลการประเมิน
                </h3>
                
                <div className="space-y-5 flex-1 z-10">
                  <div className={`p-6 rounded-2xl border ${isHighRiskSB ? 'bg-red-50/50 border-red-100' : 'bg-slate-50 border-slate-100'}`}>
                    <p className="text-sm font-semibold text-slate-500 mb-2 tracking-wide uppercase">คะแนน STOP-BANG</p>
                    <div className="flex justify-between items-end">
                      <span className={`text-5xl font-bold tracking-tighter ${isHighRiskSB ? 'text-red-600' : 'text-slate-800'}`}>{stopBangTotal} <span className="text-2xl text-slate-400 font-medium">/ 8</span></span>
                      <span className={`px-4 py-1.5 rounded-full text-sm font-bold shadow-sm ${isHighRiskSB ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'}`}>{isHighRiskSB ? 'ความเสี่ยงสูง' : 'ความเสี่ยงต่ำ'}</span>
                    </div>
                  </div>

                  <div className={`p-6 rounded-2xl border ${isHighRiskEp ? 'bg-orange-50/50 border-orange-100' : 'bg-slate-50 border-slate-100'}`}>
                    <p className="text-sm font-semibold text-slate-500 mb-2 tracking-wide uppercase">คะแนน Epworth</p>
                    <div className="flex justify-between items-end">
                      <span className={`text-5xl font-bold tracking-tighter ${isHighRiskEp ? 'text-orange-600' : 'text-slate-800'}`}>{epworthTotal} <span className="text-2xl text-slate-400 font-medium">/ 24</span></span>
                      <span className={`px-4 py-1.5 rounded-full text-sm font-bold shadow-sm ${isHighRiskEp ? 'bg-orange-100 text-orange-700 border border-orange-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'}`}>{isHighRiskEp ? 'ง่วงนอนผิดปกติ' : 'ปกติ'}</span>
                    </div>
                  </div>
                </div>

                <div className="pt-8 mt-6 flex flex-col gap-3">
                  <button onClick={exportSummaryToPDF} className="w-full bg-[#0f172a] hover:bg-slate-800 text-amber-400 px-6 py-4 rounded-xl transition-all duration-300 font-semibold flex items-center justify-center gap-2 shadow-lg hover:shadow-xl hover:-translate-y-0.5 border border-amber-500/20">
                    <Icon name="Printer" size={20} /> พิมพ์ใบรายงานผลสำหรับแพทย์
                  </button>
                  <button onClick={() => { setSubmitSuccess(false); setFormData({
                    patientName: '', phone: '', rights: '', hn: '', visitType: '', appointmentDate: '', weight: '', height: '', bmi: '',
                    symptoms: [], medicalHistory: '', sleepTime: '', beverages: '',
                    stopBang: Array(8).fill(null), epworth: Array(8).fill(null), contactRequested: ''
                  }); }} className="w-full bg-white text-slate-600 px-6 py-4 rounded-xl hover:bg-slate-50 transition-colors font-medium border border-slate-200 shadow-sm hover:text-slate-900">
                    ส่งข้อมูลผู้ป่วยรายอื่น
                  </button>
                </div>
              </div>
              
              {/* Inline AI Chat Panel */}
              <div className="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 flex flex-col overflow-hidden h-[600px] lg:h-auto">
                 <InlineChatbot stopBangTotal={stopBangTotal} epworthTotal={epworthTotal} formData={formData} />
              </div>
            </div>
          </div>
        );
      }

      return (
        <form onSubmit={handleSubmit} className="bg-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-3xl overflow-hidden border border-slate-100/80">
          <div className="bg-gradient-to-r from-[#0f172a] to-slate-800 p-8 md:p-10 text-white relative overflow-hidden">
            <div className="absolute -right-10 -top-10 w-40 h-40 bg-amber-500 opacity-10 rounded-full blur-3xl"></div>
            <h2 className="text-3xl font-bold flex items-center gap-3 tracking-tight relative z-10">
              <div className="p-2 bg-amber-500/20 rounded-xl border border-amber-500/30 text-amber-400"><Icon name="FileText" size={28}/></div>
              ส่งตรวจการนอนหลับ (Sleep Test)
            </h2>
            <p className="text-slate-300 mt-3 font-medium text-lg relative z-10">กรุณากรอกข้อมูลให้ครบถ้วน เพื่อการประเมินที่แม่นยำ</p>
          </div>

          <div className="p-6 md:p-10 space-y-10">
            {/* Section 1: ข้อมูลผู้ป่วย */}
            <section>
              <h3 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-3">
                <div className="w-1.5 h-6 bg-amber-500 rounded-full shadow-sm"></div> ข้อมูลเบื้องต้น
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">ชื่อ-นามสกุล <span className="text-red-500">*</span></label><input required type="text" className="premium-input" placeholder="ระบุชื่อเต็ม" onChange={e => setFormData({...formData, patientName: e.target.value})} /></div>
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">เบอร์โทรศัพท์ <span className="text-red-500">*</span></label><input required type="tel" className="premium-input" placeholder="08X-XXX-XXXX" onChange={e => setFormData({...formData, phone: e.target.value})} /></div>
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">รหัสประจำตัวผู้ป่วย (HN)</label><input type="text" className="premium-input" placeholder="ตัวเลข 7 หลัก" onChange={e => setFormData({...formData, hn: e.target.value})} /></div>
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-1.5">สิทธิการรักษา</label>
                  <select className="premium-input appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2224%22%20height%3D%2224%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M7%2010l5%205%205-5H7z%22%20fill%3D%22%2364748b%22%2F%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_10px_center]" onChange={e => setFormData({...formData, rights: e.target.value})}>
                    <option value="">-- กรุณาเลือกสิทธิ --</option>
                    <option value="ข้าราชการเบิกจ่ายตรง">สวัสดิการข้าราชการ</option>
                    <option value="ประกันสังคม">ประกันสังคม</option>
                    <option value="สิทธิ30บาท สปสช">หลักประกันสุขภาพ (บัตรทอง)</option>
                  </select>
                </div>
                <div className="md:col-span-2 bg-slate-50/80 p-5 rounded-2xl border border-slate-100 flex flex-col md:flex-row md:items-center gap-4 justify-between">
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">ประเภทการเข้ารับบริการ</label>
                    <div className="flex gap-6">
                      <label className="flex items-center gap-2 cursor-pointer group"><input type="radio" name="visit" value="ครั้งแรก" className="w-5 h-5 accent-amber-500" onChange={e=>setFormData({...formData, visitType:e.target.value})}/> <span className="group-hover:text-amber-600 transition-colors">ตรวจครั้งแรก</span></label>
                      <label className="flex items-center gap-2 cursor-pointer group"><input type="radio" name="visit" value="ครั้งที่..." className="w-5 h-5 accent-amber-500" onChange={e=>setFormData({...formData, visitType:e.target.value})}/> <span className="group-hover:text-amber-600 transition-colors">ติดตามอาการ</span></label>
                    </div>
                  </div>
                  <div className="w-full md:w-1/3">
                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">วันที่นัดหมาย</label>
                    <input type="date" className="premium-input" onChange={e => setFormData({...formData, appointmentDate: e.target.value})} />
                  </div>
                </div>
              </div>
            </section>

            <div className="w-full h-px bg-slate-100"></div>

            {/* Section 2: ประวัติและการตรวจร่างกาย */}
            <section>
              <h3 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-3">
                <div className="w-1.5 h-6 bg-amber-500 rounded-full shadow-sm"></div> ข้อมูลทางคลินิก
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">น้ำหนัก (kg)</label><input type="number" step="0.1" className="premium-input" placeholder="เช่น 65.5" onChange={e => setFormData({...formData, weight: e.target.value})} /></div>
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">ส่วนสูง (cm)</label><input type="number" step="0.1" className="premium-input" placeholder="เช่น 170" onChange={e => setFormData({...formData, height: e.target.value})} /></div>
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">ดัชนีมวลกาย (BMI)</label><input type="text" readOnly className="w-full border border-slate-200 bg-slate-100 rounded-xl p-3 text-slate-500 font-semibold cursor-not-allowed" value={formData.bmi} placeholder="คำนวณอัตโนมัติ" /></div>
              </div>
              
              <div className="bg-slate-50/80 p-6 rounded-2xl border border-slate-100 mb-6">
                <label className="block text-sm font-semibold text-slate-900 mb-4 tracking-wide">อาการที่พบ (สามารถเลือกได้มากกว่า 1 ข้อ)</label>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm text-slate-700">
                  {['กรนเสียงดัง', 'ง่วงนอนระหว่างวัน', 'ปวดศีรษะตอนเช้า', 'หลับไม่สนิท', 'ขากระตุก/ตะคริว', 'นอนไม่หลับ', 'ละเมอ', 'นอนกัดฟัน'].map(sym => (
                    <label key={sym} className="flex items-center gap-2 cursor-pointer group hover:bg-white p-2 rounded-lg transition-colors border border-transparent hover:border-slate-200 hover:shadow-sm">
                      <input type="checkbox" value={sym.split(' ')[0]} className="w-4 h-4 rounded text-amber-500 focus:ring-amber-500 accent-amber-500" onChange={e => handleCheckboxChange(e, 'symptoms')}/> 
                      <span className="font-medium group-hover:text-amber-700 transition-colors">{sym}</span>
                    </label>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div className="md:col-span-2"><label className="block text-sm font-semibold text-slate-700 mb-1.5">โรคประจำตัว / ยาที่รับประทานประจำ</label><textarea className="premium-input resize-none h-24" placeholder="ระบุรายละเอียด (หากไม่มีให้เว้นว่าง)" onChange={e => setFormData({...formData, medicalHistory: e.target.value})}></textarea></div>
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">เวลาเข้านอน - ตื่นนอน</label><input type="text" className="premium-input" placeholder="เช่น 22.00 - 06.00 น." onChange={e => setFormData({...formData, sleepTime: e.target.value})} /></div>
                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">พฤติกรรมการดื่ม ชา/กาแฟ/แอลกอฮอล์</label><input type="text" className="premium-input" placeholder="ระบุชนิดและความถี่" onChange={e => setFormData({...formData, beverages: e.target.value})} /></div>
              </div>
            </section>
            
            <div className="w-full h-px bg-slate-100"></div>

            {/* STOP-BANG Section */}
            <section className="bg-white border border-slate-200 shadow-sm rounded-3xl overflow-hidden relative">
              <div className="absolute top-0 left-0 w-1.5 h-full bg-red-500"></div>
              <div className="p-6 md:p-8">
                <div className="flex flex-col sm:flex-row justify-between sm:items-center mb-6 gap-4">
                  <div>
                    <h3 className="text-xl font-bold text-slate-900">แบบประเมิน STOP-BANG</h3>
                    <p className="text-sm text-slate-500 mt-1">คัดกรองความเสี่ยงภาวะหยุดหายใจขณะหลับ (OSA)</p>
                  </div>
                  <div className="bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 font-bold text-lg text-slate-800 shadow-sm flex items-center gap-2">
                    คะแนนรวม: <span className="text-red-600 text-2xl">{stopBangTotal}</span>
                  </div>
                </div>
                
                <div className="space-y-1">
                  {stopBangQuestions.map((q, idx) => (
                    <div key={idx} className="flex flex-col sm:flex-row sm:justify-between sm:items-center p-4 rounded-xl hover:bg-slate-50 transition-colors border border-transparent hover:border-slate-100 gap-4">
                      <span className="text-[15px] font-medium text-slate-700 flex-1 pr-4"><span className="text-slate-400 mr-2">{idx+1}.</span> {q}</span>
                      <div className="flex gap-4 sm:shrink-0 bg-white sm:bg-transparent p-2 sm:p-0 rounded-lg shadow-sm sm:shadow-none border sm:border-none border-slate-200">
                        <label className="flex items-center gap-2 cursor-pointer group"><input type="radio" name={`sb${idx}`} required className="w-5 h-5 accent-red-500" onChange={() => {const a=[...formData.stopBang];a[idx]=1;setFormData({...formData,stopBang:a});}}/> <span className="font-semibold text-slate-600 group-hover:text-red-600">ใช่</span></label>
                        <div className="w-px h-5 bg-slate-200 hidden sm:block"></div>
                        <label className="flex items-center gap-2 cursor-pointer group"><input type="radio" name={`sb${idx}`} required className="w-5 h-5 accent-red-500" onChange={() => {const a=[...formData.stopBang];a[idx]=0;setFormData({...formData,stopBang:a});}}/> <span className="font-semibold text-slate-600 group-hover:text-red-600">ไม่ใช่</span></label>
                      </div>
                    </div>

                    <a href="https://line.me/R/ti/p/@871ykqyc" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-[#00B900] hover:bg-[#009900] text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-sm hover:shadow-md">

    // ==========================================
    // Admin Sections (Premium Look)

    function AdminLogin({ onLogin }) {
      const [u, setU] = useState(''); const [p, setP] = useState('');
      const submit = e => { e.preventDefault(); if(u==='admin'&&p==='1234') onLogin(); else alert('Invalid Credentials'); };
      return (
        <div className="max-w-md mx-auto mt-20 bg-white p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100">
          <div className="w-20 h-20 bg-[#0f172a] rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3 border border-amber-500/30">
            <Icon name="User" size={32} className="text-amber-400 -rotate-3" />
          </div>
          <h2 className="text-2xl text-center font-bold mb-2 text-slate-900">เจ้าหน้าที่คลินิก</h2>

            <div><label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">ชื่อผู้ใช้</label><input type="text" className="premium-input" value={u} onChange={e=>setU(e.target.value)}/></div>
            <div><label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">รหัสผ่าน</label><input type="password" className="premium-input" value={p} onChange={e=>setP(e.target.value)}/></div>
            <button type="submit" className="w-full bg-[#0f172a] hover:bg-slate-800 text-amber-400 font-bold py-3.5 rounded-xl transition-all shadow-md mt-4 border border-amber-500/20">เข้าสู่ระบบ</button>
          </form>
        </div>
      );
    }

    function AdminDashboard({ user }) {
      const [patients, setPatients] = useState([]);
      useEffect(() => {
        if (!user || !db || !window.FirebaseHelpers) return;
        const { query, collection, onSnapshot } = window.FirebaseHelpers;
        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'sleep_tests'));
        return onSnapshot(q, (snap) => {
          const d = []; snap.forEach(doc => d.push({id: doc.id, ...doc.data()}));
          setPatients(d.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
        });
      }, [user]);

      const exportDoc = (p) => {
        const blob = new Blob(['\ufeff', generateFormHTML(p)], { type: 'application/msword' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
        link.download = `SleepTest_${p.patientName||'Doc'}.doc`;
        link.click();
      };

      const hRisk = patients.filter(p => p.stopBangScore >= 3).length;

      return (
        <div className="space-y-8 animate-in fade-in">
          <h2 className="text-3xl font-bold text-slate-900 tracking-tight">แดชบอร์ดจัดการข้อมูล</h2>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-5">
              <div className="p-4 bg-[#0f172a] text-amber-400 rounded-xl shadow-md border border-amber-500/20"><Icon name="User" size={28}/></div>
              <div><p className="text-sm font-semibold text-slate-500 uppercase tracking-wide">เคสทั้งหมด</p><p className="text-3xl font-bold text-slate-900">{patients.length}</p></div>
            </div>
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-5">
              <div className="p-4 bg-red-50 text-red-600 rounded-xl shadow-sm border border-red-100"><Icon name="Activity" size={28}/></div>
              <div><p className="text-sm font-semibold text-slate-500 uppercase tracking-wide">ความเสี่ยงสูง</p><p className="text-3xl font-bold text-red-600">{hRisk}</p></div>
            </div>
          </div>

          <div className="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead><tr className="bg-slate-50/80 border-b border-slate-100"><th className="p-5 font-bold text-slate-600">วันที่ / ผู้ป่วย</th><th className="p-5 font-bold text-slate-600 text-center">STOP-BANG</th><th className="p-5 font-bold text-slate-600 text-center">Epworth</th><th className="p-5 font-bold text-slate-600 text-right">ส่งออกรายงาน</th></tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {patients.length === 0 ? <tr><td colSpan="4" className="p-10 text-center text-slate-400 font-medium">ยังไม่มีข้อมูลผู้ป่วยในระบบ</td></tr> : 
                  patients.map(p=>(
                    <tr key={p.id} className="hover:bg-slate-50/50 transition-colors">
                      <td className="p-5"><div className="font-bold text-slate-900">{p.patientName}</div><div className="text-sm text-slate-500">{new Date(p.createdAt).toLocaleDateString('th-TH')} • HN: {p.hn||'-'}</div></td>
                      <td className="p-5 text-center"><span className={`inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-sm ${p.stopBangScore>=3?'bg-red-100 text-red-700':'bg-emerald-100 text-emerald-700'}`}>{p.stopBangScore}</span></td>
                      <td className="p-5 text-center"><span className={`inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-sm ${p.epworthScore>10?'bg-orange-100 text-orange-700':'bg-emerald-100 text-emerald-700'}`}>{p.epworthScore}</span></td>
                      <td className="p-5 text-right"><button onClick={()=>exportDoc(p)} className="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors border border-slate-200"><Icon name="Download" size={16}/> Word (.doc)</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================

      const [isTyping, setIsTyping] = useState(false); const endRef = useRef(null);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, isTyping]);

      // ฝัง API Key ตามที่คุณระบุไว้
      const apiKey = "AIzaSyAERuyavwh0bLLYLS-DbRXHu82xBKLO-LA";

      const send = async e => {
        e.preventDefault(); if(!input) return;
        const uTxt = input; setMsgs(p=>[...p, {role:'user',text:uTxt}]); setInput(''); setIsTyping(true);
        try {
          const payload = {
            contents: [{ parts: [{ text: uTxt }] }],

        }

      };
      return (
        <div className="fixed bottom-6 right-6 z-50">
          {!open && <button onClick={()=>setOpen(true)} className="bg-[#0f172a] text-amber-400 p-4 rounded-full shadow-[0_10px_40px_rgba(245,158,11,0.25)] hover:shadow-[0_10px_50px_rgba(245,158,11,0.4)] border border-amber-500/30 transition-all hover:-translate-y-1"><Icon name="MessageCircle" size={28} /></button>}

            <div className="flex-1 overflow-auto p-4 space-y-3 bg-slate-50 custom-scrollbar">
              {msgs.map((m,i)=><div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={`px-4 py-2.5 rounded-2xl max-w-[85%] text-[15px] leading-relaxed shadow-sm ${m.role==='user'?'bg-[#0f172a] text-white rounded-br-sm':'bg-white text-slate-800 border border-slate-100 rounded-bl-sm'}`}>{m.text}</div></div>)}

              <div ref={endRef}/>
            </div>
            <form onSubmit={send} className="p-3 bg-white border-t border-slate-100 flex gap-2">
              <input className="flex-1 border border-slate-200 bg-slate-50 focus:bg-white rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all" placeholder="พิมพ์ข้อความที่นี่..." value={input} onChange={e=>setInput(e.target.value)}/>
              <button disabled={isTyping} className="bg-[#0f172a] text-amber-400 p-2.5 rounded-xl hover:bg-slate-800 transition-colors disabled:opacity-50"><Icon name="Send" size={20}/></button>
            </form>

             <div className="text-sm text-slate-400 mt-0.5">ผู้เชี่ยวชาญด้านเวชศาสตร์การนอนหลับ 24 ชม.</div>

            <div ref={endRef}/>

          <form onSubmit={send} className="p-4 bg-white border-t border-slate-100 flex gap-3">

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
